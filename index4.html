<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение элементов по классу</title>
</head>
<body>

    <div class="description">Описание 1</div>
    <p class="description">Описание 2</p>
    <span class="description">Описание 3</span>
    <div class="other-element">Другой элемент</div>
    <p class="description">Описание 4</p>

    <script>
        const descriptions = document.querySelectorAll('.description');

        descriptions.forEach(element => {
            element.textContent = 'Измененный текст';
        });
    </script>

</body>
</html>
