<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление элемента по классу</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #removeButton {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c36f4;
            color: white;
            border: none;
            border-radius: 5px;
            
            font-size: 16px;
        }

        #removeButton:hover {
            background-color: #b7f242;
        }

        .description {
            margin-top: 10px;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Удаление абзаца с классом</h1>
    <p class="description">БА БА БА.</p>
    <p>Просто абзац.</p>
    <p class="description">БЕ БЕ БЕ.</p>
    <p>Еще один абзац.</p>
    <p class="description">БАБЕБАБЕБАБЕБАБЕБББАА.</p>

    <button id="removeButton">Удалить элемент</button>

    <script>
        const button = document.querySelector('#removeButton');

        button.addEventListener('click', function() {
            const firstDescription = document.querySelector('.description');

            if (firstDescription) {
                firstDescription.remove();
            } else {
                alert('Нет абзацев с классом description для удаления.');
            }
        });
    </script>

</body>
</html>
