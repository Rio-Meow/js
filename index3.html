<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение текста заголовка</title>
    <style>
        #changeTextButton {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #f44336;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1 id="myHeading">Исходный текст</h1>
    <button id="changeTextButton">Изменить текст</button>

    <script>
        const heading = document.querySelector('#myHeading');
        const button = document.querySelector('#changeTextButton');

        button.addEventListener('click', function() {
            heading.textContent = 'Привет, мир!';
        });
    </script>

</body>
</html>
